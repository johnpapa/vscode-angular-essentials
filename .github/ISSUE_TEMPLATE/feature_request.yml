name: Feature request
description: Suggest a new extension or maintenance improvement for this extension pack.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. This pack stays intentionally small, so please focus on broad, high-value additions.
  - type: input
    id: extension_name
    attributes:
      label: Extension name (if applicable)
      placeholder: e.g. publisher.extension-id
  - type: input
    id: marketplace_url
    attributes:
      label: Marketplace URL
      placeholder: https://marketplace.visualstudio.com/items?itemName=publisher.extension-id
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What developer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the exact change you want in this repo.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this should be in Angular Essentials
      description: Explain broad usefulness, maintenance confidence, and why this belongs in a curated core pack.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any tradeoffs, risks, or alternatives?

